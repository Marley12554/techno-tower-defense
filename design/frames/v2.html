<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Style frames v2</title>
<!--
  Round 2: C palette, B atmosphere (toned down), depth (tilted top-down volume, materials, light), role colors.
  ?view=board|towers|ui
-->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --mono: 'IBM Plex Mono', ui-monospace, monospace; --cond: 'IBM Plex Sans Condensed', 'IBM Plex Mono', sans-serif;
    --bg: #0a0c0f; --base: #0f1216; --raised-a: #181c22; --raised-b: #121519; --inset: #08090c;
    --edge: #252b33; --edge2: #323a44; --hi: rgba(255,255,255,0.07);
    --ink: #e2e9f0; --dim: #7a8592; --mute: #4c5662;
    --ice: #cfe6ff; --dmg: #46c8ff; --area: #35e0b2; --sup: #a58bff; --hot: #ff4d4f; --warn: #ffa940;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--mono); }
  #stage { position: absolute; inset: 0; }
  #stage > canvas { position: absolute; inset: 0; }

  /* surfaces: base, raised, inset */
  .raised { background: linear-gradient(180deg, var(--raised-a), var(--raised-b)); border: 1px solid var(--edge); box-shadow: inset 0 1px 0 var(--hi), 0 2px 6px rgba(0,0,0,0.45); }
  .inset { background: var(--inset); border: 1px solid #14181d; box-shadow: inset 0 1px 3px rgba(0,0,0,0.7); }

  .top { position: absolute; left: 8px; top: 7px; right: 220px; height: 32px; display: flex; align-items: center; gap: 6px; }
  .sq { width: 32px; height: 32px; display: grid; place-items: center; color: var(--ink); }
  .sq svg { width: 14px; height: 14px; }
  .sq.on { border-color: color-mix(in srgb, var(--ice) 55%, var(--edge)); color: var(--ice); }
  .sector { margin-left: 8px; display: flex; flex-direction: column; line-height: 1.2; }
  .sector b { font-family: var(--cond); font-weight: 600; font-size: 12px; letter-spacing: 1.5px; }
  .sector span { font-size: 9px; color: var(--dim); letter-spacing: 1px; }
  .sector span i { font-style: normal; color: var(--hot); }
  .spacer { flex: 1; }
  .next { display: flex; align-items: center; gap: 5px; font-size: 9.5px; color: var(--dim); letter-spacing: 1px; }
  .next .tag { color: var(--ink); padding: 3px 7px; }
  .next .tag i { font-style: normal; color: var(--hot); }
  .wave { font-family: var(--cond); font-size: 12px; letter-spacing: 1.5px; padding: 0 10px; height: 32px; display: flex; align-items: center; }
  .wave em { font-style: normal; color: var(--dim); margin-left: 4px; }

  .console { position: absolute; top: 0; right: 0; bottom: 0; width: 212px; background: linear-gradient(180deg, #11141a, #0d1014); border-left: 1px solid var(--edge2); box-shadow: -12px 0 24px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
  .c-head { padding: 9px 10px 9px; display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: end; border-bottom: 1px solid var(--edge); }
  .lbl { font-size: 8.5px; letter-spacing: 1.6px; color: var(--dim); text-transform: uppercase; }
  .big { font-family: var(--cond); font-weight: 600; font-size: 20px; line-height: 1; }
  .big small { font-size: 11px; color: var(--dim); font-weight: 500; }
  .bits { text-align: right; }
  .bits .gain { font-size: 10px; color: var(--dmg); }
  .integ { grid-column: 1 / -1; height: 6px; margin-top: 3px; position: relative; border-radius: 1px; }
  .integ i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(180deg, #e6f3ff, #9cc9f2); box-shadow: 0 0 8px rgba(160,205,255,0.45); }
  .tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 6px 8px 0; gap: 4px; }
  .tabs div { text-align: center; padding: 6px 0 6px; font-size: 9px; letter-spacing: 1.8px; color: var(--dim); border-bottom: 2px solid transparent; }
  .tabs div.on { color: var(--ink); border-bottom-color: var(--ice); }
  .asset { padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 0; }
  .a-top { display: flex; gap: 8px; align-items: center; }
  .a-top .ic { width: 38px; height: 38px; position: relative; }
  .a-top .ic canvas { position: absolute; inset: 0; }
  .a-name { font-family: var(--cond); font-weight: 600; font-size: 14px; letter-spacing: 1px; }
  .a-tier { font-size: 8.5px; color: var(--dim); letter-spacing: 1.1px; }
  .role { display: inline-block; font-size: 7.5px; letter-spacing: 1.2px; padding: 1px 4px; margin-right: 4px; color: var(--area); border: 1px solid color-mix(in srgb, var(--area) 45%, transparent); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
  .stats div { display: flex; justify-content: space-between; padding: 3px 6px; font-size: 9.5px; }
  .stats span { color: var(--dim); }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); padding: 2px; gap: 2px; }
  .seg div { text-align: center; font-size: 8px; letter-spacing: 0.8px; padding: 4px 0; color: var(--dim); }
  .seg div.on { color: var(--ink); background: linear-gradient(180deg, #232931, #1a1f25); box-shadow: inset 0 1px 0 var(--hi); }
  .branches { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .br { padding: 6px 7px 7px; display: flex; flex-direction: column; gap: 3px; position: relative; }
  .br.on { border-color: color-mix(in srgb, var(--area) 60%, var(--edge)); box-shadow: inset 0 1px 0 var(--hi), 0 0 0 1px color-mix(in srgb, var(--area) 25%, transparent), 0 2px 6px rgba(0,0,0,0.45); }
  .br b { font-family: var(--cond); font-size: 11px; letter-spacing: 0.6px; }
  .br span { font-size: 8.5px; color: var(--dim); line-height: 1.25; }
  .actions { display: grid; grid-template-columns: 1fr 1.25fr; gap: 5px; margin-top: auto; }

  /* buttons */
  .btn { position: relative; height: 32px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 9px; letter-spacing: 1.3px; color: var(--ink); }
  .btn .cost { font-size: 9.5px; padding: 2px 6px; color: var(--ice); }
  .btn.primary { border-color: color-mix(in srgb, var(--ice) 50%, var(--edge2)); }
  .btn.primary::before { content: ''; position: absolute; left: 8px; right: 8px; top: -1px; height: 1px; background: linear-gradient(90deg, transparent, var(--ice), transparent); opacity: 0.9; }
  .btn.hover { border-color: var(--ice); box-shadow: inset 0 1px 0 var(--hi), 0 0 12px rgba(190,220,255,0.18), 0 2px 6px rgba(0,0,0,0.45); }
  .btn.pressed { background: linear-gradient(180deg, #101317, #14181d); box-shadow: inset 0 2px 4px rgba(0,0,0,0.6); transform: translateY(1px); }
  .btn.pressed::before { opacity: 0.4; }
  .btn.disabled { background: var(--inset); border-color: #161a1f; box-shadow: inset 0 1px 3px rgba(0,0,0,0.7); color: var(--mute); }
  .btn.disabled::before { display: none; }
  .btn.disabled .cost { color: #8a4a4c; }
  .btn.ghost { color: var(--dim); }
  .c-foot { padding: 6px 10px; border-top: 1px solid var(--edge); font-size: 8.5px; white-space: nowrap; overflow: hidden; }
  .c-foot .t { color: var(--dim); }
  .c-foot u { text-decoration: none; color: var(--dmg); }

  /* ui sheet */
  .uisheet { position: absolute; inset: 0; padding: 14px 16px; display: grid; grid-template-columns: 1fr 212px; gap: 18px; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .h { font-family: var(--cond); font-size: 11px; letter-spacing: 2px; color: var(--dim); border-bottom: 1px solid var(--edge); padding-bottom: 4px; }
  .states { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; align-items: end; }
  .states figure { margin: 0; display: flex; flex-direction: column; gap: 5px; }
  .states figcaption { font-size: 8px; letter-spacing: 1.4px; color: var(--mute); text-align: center; }
  .deploy { display: flex; flex-direction: column; gap: 5px; padding: 6px 8px; }
  .card { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 8px; padding: 4px 8px 4px 4px; height: 50px; position: relative; }
  .card .ic { width: 40px; height: 40px; position: relative; }
  .card .ic canvas { position: absolute; inset: 0; }
  .card b { font-family: var(--cond); font-size: 12px; letter-spacing: 0.6px; display: block; }
  .card small { font-size: 8px; letter-spacing: 1px; }
  .card .cost { font-size: 10px; padding: 2px 6px; color: var(--ice); }
  .card::after { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2px; background: var(--rc); box-shadow: 0 0 6px var(--rc); }
  .card.poor { background: var(--inset); box-shadow: inset 0 1px 3px rgba(0,0,0,0.7); }
  .card.poor b { color: var(--dim); }
  .card.poor .cost { color: #8a4a4c; }
  .card.poor::after { opacity: 0.3; }
  .roles { display: flex; gap: 14px; font-size: 9px; letter-spacing: 1.2px; color: var(--dim); }
  .roles span::before { content: ''; display: inline-block; width: 8px; height: 8px; margin-right: 5px; background: var(--rc); box-shadow: 0 0 6px var(--rc); vertical-align: -1px; }
  .log { display: flex; flex-direction: column; gap: 3px; font-size: 9px; padding: 6px 8px; }
  .log div { display: grid; grid-template-columns: 48px 1fr; gap: 6px; }
  .log .t { color: var(--mute); }
  .log b { font-weight: 500; color: var(--hot); }
  .log u { text-decoration: none; color: var(--dmg); }
  .log s { text-decoration: none; color: var(--sup); }

  /* atmosphere: B's finish, at low strength */
  .atmo { position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 3px), radial-gradient(ellipse at 45% 50%, transparent 58%, rgba(0,0,0,0.5)); mix-blend-mode: normal; }
  .title { position: absolute; left: 16px; top: 10px; font-family: var(--cond); font-size: 12px; letter-spacing: 2px; color: var(--dim); }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const VIEW = new URLSearchParams(location.search).get('view') || 'board';
const W = innerWidth, H = innerHeight, DPR = 2;
const C = {
  bg: '#0a0c0f', board: '#0d1014', ink: '#e2e9f0', dim: '#7a8592', mute: '#4c5662', ice: '#cfe6ff',
  dmg: '#46c8ff', area: '#35e0b2', sup: '#a58bff', hot: '#ff4d4f', warn: '#ffa940',
  bodyTop: ['#262c34', '#1a1f25'], bodySide: ['#14181d', '#0a0c0f'],
};
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function mix(h1, h2, t) { const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16); const c = (s) => Math.round(((a >> s) & 255) * (1 - t) + ((b >> s) & 255) * t); return '#' + [c(16), c(8), c(0)].map((v) => v.toString(16).padStart(2, '0')).join(''); }
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w * DPR; c.height = h * DPR; c.style.width = w + 'px'; c.style.height = h + 'px'; const g = c.getContext('2d'); g.scale(DPR, DPR); return [c, g]; }
function polyPath(g, pts) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath(); }
const hexPts = (x, y, r) => Array.from({ length: 6 }, (_, i) => { const a = Math.PI / 6 + i * Math.PI / 3; return [x + Math.cos(a) * r, y + Math.sin(a) * r * 0.86]; });
const octPts = (x, y, r) => Array.from({ length: 8 }, (_, i) => { const a = Math.PI / 8 + i * Math.PI / 4; return [x + Math.cos(a) * r, y + Math.sin(a) * r * 0.86]; });
const rectPts = (x, y, w, h) => [[x - w, y - h], [x + w, y - h], [x + w, y + h], [x - w, y + h]];
const circlePath = (x, y, r) => (g) => { g.beginPath(); g.ellipse(x, y, r, r * 0.86, 0, 0, Math.PI * 2); };
const ptsPath = (pts) => (g) => polyPath(g, pts);

/*
 * Tilted top-down volume: an object's top face sits `h` px above its footprint and
 * the front face shows below it. Light comes from the upper left.
 */
function shadow(g, path, x, y, h) {
  g.save(); g.translate(h * 0.55, h * 0.75); g.filter = `blur(${Math.max(1.5, h * 0.35)}px)`; path(g); g.fillStyle = 'rgba(0,0,0,0.55)'; g.fill(); g.restore();
}
function solid(g, shapeAt, x, y, h, opts = {}) {
  const top = opts.top || C.bodyTop, side = opts.side || C.bodySide, rim = opts.rim;
  shadow(g, shapeAt(x, y), x, y, h);
  // front face: stack the footprint upward, darkest at the ground
  for (let k = 0; k <= h; k += 0.5) { shapeAt(x, y - k)(g); g.fillStyle = mix(side[1], side[0], k / Math.max(1, h)); g.fill(); }
  // top face
  const p = shapeAt(x, y - h); p(g);
  const grd = g.createLinearGradient(x - 20, y - h - 20, x + 20, y - h + 20); grd.addColorStop(0, top[0]); grd.addColorStop(1, top[1]);
  g.fillStyle = grd; g.fill();
  // lit top edge + accent rim
  g.save(); p(g); g.clip(); g.strokeStyle = 'rgba(255,255,255,0.16)'; g.lineWidth = 2; g.translate(0.6, 0.9); p(g); g.stroke(); g.restore();
  if (rim) { p(g); g.strokeStyle = rgba(rim, 0.55); g.lineWidth = 1; g.stroke(); }
  return y - h;
}
function emissive(g, x, y, r, col, a = 1) {
  g.save(); g.globalCompositeOperation = 'lighter';
  const grd = g.createRadialGradient(x, y, 0, x, y, r * 3.2); grd.addColorStop(0, rgba(col, 0.55 * a)); grd.addColorStop(0.35, rgba(col, 0.16 * a)); grd.addColorStop(1, rgba(col, 0));
  g.fillStyle = grd; g.beginPath(); g.arc(x, y, r * 3.2, 0, 7); g.fill(); g.restore();
  g.save(); g.fillStyle = mix(col, '#ffffff', 0.55); g.beginPath(); g.ellipse(x, y, r, r * 0.86, 0, 0, 7); g.fill();
  g.fillStyle = '#ffffff'; g.beginPath(); g.ellipse(x - r * 0.25, y - r * 0.25, r * 0.4, r * 0.34, 0, 0, 7); g.fill(); g.restore();
}
function lightPool(g, x, y, r, col, a = 0.16) {
  g.save(); g.globalCompositeOperation = 'lighter';
  const grd = g.createRadialGradient(x, y, 0, x, y, r); grd.addColorStop(0, rgba(col, a)); grd.addColorStop(1, rgba(col, 0));
  g.fillStyle = grd; g.beginPath(); g.ellipse(x, y, r, r * 0.86, 0, 0, 7); g.fill(); g.restore();
}

/* ------------------------------------------------------------------ towers */
function inspector(g, x, y, s, tier) {
  const col = C.dmg, h = s * (0.12 + tier * 0.04);
  lightPool(g, x, y + s * 0.05, s * 0.85, col, 0.12 + tier * 0.03);
  if (tier >= 3) { // ground ring + three sensor pods
    g.save(); g.strokeStyle = rgba(col, 0.35); g.lineWidth = 1; g.beginPath(); g.ellipse(x, y, s * 0.46, s * 0.4, 0, 0, 7); g.stroke(); g.restore();
    for (let k = 0; k < 3; k++) { const a = -Math.PI / 2 + Math.PI / 6 + k * Math.PI * 2 / 3; const px = x + Math.cos(a) * s * 0.42, py = y + Math.sin(a) * s * 0.36; const ty = solid(g, (xx, yy) => circlePath(xx, yy, s * 0.065), px, py, s * 0.1); emissive(g, px, ty, s * 0.025, col, 0.7); }
  }
  if (tier >= 2) for (const sx of [-1, 1]) solid(g, (xx, yy) => ptsPath(rectPts(xx, yy, s * 0.05, s * 0.14)), x + sx * s * 0.31, y, h * 0.7, { rim: col });
  const ty = solid(g, (xx, yy) => ptsPath(hexPts(xx, yy, s * 0.29)), x, y, h, { rim: col });
  // lens turret on top
  const ly = solid(g, (xx, yy) => circlePath(xx, yy, s * 0.12), x, ty, s * 0.05, { rim: col });
  g.save(); g.beginPath(); g.ellipse(x, ly, s * 0.085, s * 0.073, 0, 0, 7); g.fillStyle = '#06131a'; g.fill(); g.restore();
  emissive(g, x, ly, s * 0.045, col);
}
function limiter(g, x, y, s, tier) {
  const col = C.sup, h = s * (0.1 + tier * 0.035);
  lightPool(g, x, y + s * 0.05, s * 0.85, col, 0.12 + tier * 0.03);
  if (tier >= 3) for (let k = 0; k < 4; k++) { const a = Math.PI / 4 + k * Math.PI / 2; const px = x + Math.cos(a) * s * 0.4, py = y + Math.sin(a) * s * 0.34; const ty = solid(g, (xx, yy) => ptsPath(rectPts(xx, yy, s * 0.035, s * 0.035)), px, py, s * 0.16); emissive(g, px, ty, s * 0.022, col, 0.8); }
  if (tier >= 2) solid(g, (xx, yy) => circlePath(xx, yy, s * 0.36), x, y, s * 0.04, { rim: col });
  const ty = solid(g, (xx, yy) => circlePath(xx, yy, s * 0.29), x, y, h, { rim: col });
  // iris: blades converge on a bright aperture
  g.save(); g.beginPath(); g.ellipse(x, ty, s * 0.21, s * 0.18, 0, 0, 7); g.fillStyle = '#0c0a14'; g.fill(); g.clip();
  for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; g.beginPath(); g.moveTo(x + Math.cos(a) * s * 0.24, ty + Math.sin(a) * s * 0.2); g.lineTo(x + Math.cos(a + 1.15) * s * 0.06, ty + Math.sin(a + 1.15) * s * 0.05); g.lineTo(x + Math.cos(a + 0.6) * s * 0.26, ty + Math.sin(a + 0.6) * s * 0.22); g.closePath(); g.fillStyle = k % 2 ? '#1c1a26' : '#24212f'; g.fill(); g.strokeStyle = rgba(col, 0.45); g.lineWidth = 0.7; g.stroke(); }
  g.restore();
  emissive(g, x, ty, s * 0.04, col);
}
function sandbox(g, x, y, s, tier, branch) {
  const col = C.area, h = s * (0.13 + tier * 0.035);
  lightPool(g, x, y + s * 0.05, s * 0.9, col, 0.12 + tier * 0.03);
  if (branch === 'cluster') for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) { const px = x + sx * s * 0.38, py = y + sy * s * 0.33; const ty = solid(g, (xx, yy) => ptsPath(rectPts(xx, yy, s * 0.07, s * 0.06)), px, py, h * 0.8, { rim: col }); emissive(g, px, ty, s * 0.022, col, 0.8); }
  if (tier >= 2 && branch !== 'cluster') solid(g, (xx, yy) => ptsPath(rectPts(xx, yy, s * 0.37, s * 0.32)), x, y, s * 0.04, { rim: col });
  const ty = solid(g, (xx, yy) => ptsPath(rectPts(xx, yy, s * 0.29, s * 0.25)), x, y, h, { rim: col });
  // recessed containment well with a floating core
  g.save(); polyPath(g, rectPts(x, ty, s * 0.17, s * 0.145)); g.fillStyle = '#04100c'; g.fill();
  g.strokeStyle = 'rgba(0,0,0,0.8)'; g.lineWidth = 2; g.stroke(); g.restore();
  g.save(); polyPath(g, [[x, ty - s * 0.1], [x + s * 0.09, ty], [x, ty + s * 0.085], [x - s * 0.09, ty]]); g.strokeStyle = rgba(col, 0.9); g.lineWidth = 1; g.stroke(); g.restore();
  emissive(g, x, ty, s * 0.035, col);
  if (branch === 'remote') { // relay mast: tall, unmistakable silhouette
    const mx = x + s * 0.2, my = y - s * 0.12;
    const top = solid(g, (xx, yy) => ptsPath(rectPts(xx, yy, s * 0.025, s * 0.022)), mx, my, s * 0.55);
    g.save(); g.strokeStyle = rgba(col, 0.85); g.lineWidth = 1.4; g.beginPath(); g.ellipse(mx, top - s * 0.02, s * 0.12, s * 0.05, -0.4, Math.PI * 0.95, Math.PI * 2.05); g.stroke(); g.restore();
    emissive(g, mx, top, s * 0.025, col);
  }
}
function upMark(g, x, y, s) { // small raised chevron tab, upper right of the cell
  g.save(); const px = x + s * 0.36, py = y - s * 0.4; g.fillStyle = '#1b2026'; g.strokeStyle = rgba(C.ice, 0.85); g.lineWidth = 1; g.beginPath(); g.roundRect(px - 6, py - 5, 12, 10, 2); g.fill(); g.stroke(); g.beginPath(); g.moveTo(px - 3, py + 1.5); g.lineTo(px, py - 1.5); g.lineTo(px + 3, py + 1.5); g.stroke(); g.restore();
}

/* ----------------------------------------------------------------- malware */
// Floating packets. Health is layers: each shell stripped shrinks it and runs it hotter.
function heat(layers, max) { return mix(C.hot, '#ffd9a8', 1 - (layers - 1) / Math.max(1, max - 1)); }
function floatShadow(g, x, y, r) { g.save(); g.filter = 'blur(2px)'; g.fillStyle = 'rgba(0,0,0,0.6)'; g.beginPath(); g.ellipse(x + r * 0.3, y + r * 0.9, r * 0.9, r * 0.4, 0, 0, 7); g.fill(); g.restore(); }
function shell(g, pts, col, a) {
  polyPath(g, pts); const b = pts.reduce((m, p) => [Math.min(m[0], p[0]), Math.min(m[1], p[1]), Math.max(m[2], p[0]), Math.max(m[3], p[1])], [1e9, 1e9, -1e9, -1e9]);
  const grd = g.createLinearGradient(b[0], b[1], b[2], b[3]); grd.addColorStop(0, rgba(col, 0.22 * a)); grd.addColorStop(1, rgba(col, 0.05 * a));

    for (const [ax, ay] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) { g.beginPath(); g.moveTo(x + ax * r, y + ay * r * 0.86); g.lineTo(x + ax * r, y + ay * r * 0.86 - r * 0.6); g.stroke(); }
    g.fillStyle = rgba(C.area, 0.06); g.fillRect(x - r, y - r * 0.86 - r * 0.6, r * 2, r * 1.72 + r * 0.6); g.restore();
    worm(g, x - s * 0.15, y, s, 1); shatter(g, x + s * 0.12, y + s * 0.05, s * 0.8); }
  // kill + merged bits token
  { const [x, y] = at(r0, 0.78, L0, 0); shatter(g, x, y, s); g.save(); g.fillStyle = '#e9f5ff'; g.font = '600 8px IBM Plex Mono'; g.textAlign = 'center'; g.shadowColor = '#9cc9f2'; g.shadowBlur = 6; g.fillText('+6', x, y - s * 0.55); g.restore(); }
  // board frame brackets
  g.strokeStyle = 'rgba(207,230,255,0.5)'; g.lineWidth = 1.5; const k = 10;
  for (const [x, y, dx, dy] of [[ox, oy, 1, 1], [ox + COLS * s, oy, -1, 1], [ox, oy + ROWS * s, 1, -1], [ox + COLS * s, oy + ROWS * s, -1, -1]]) { g.beginPath(); g.moveTo(x - dx * 3, y + dy * k); g.lineTo(x - dx * 3, y - dy * 3); g.lineTo(x + dx * k, y - dy * 3); g.stroke(); }
}
