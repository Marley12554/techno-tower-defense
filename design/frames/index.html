<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Style frames</title>
<!--
  Static style frames for the UI overhaul. Not game code.
  ?theme=a|b|c  &view=board|sheet
  a = Tactical (gunmetal + olive), b = Phosphor (CRT radar), c = Ops (graphite + ice)
-->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root { --mono: 'IBM Plex Mono', ui-monospace, monospace; --cond: 'IBM Plex Sans Condensed', 'IBM Plex Mono', sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--mono); }
  body.a { --bg:#0a0c0d; --panel:#111417; --panel2:#161a1e; --line:#262c31; --line2:#343c43; --ink:#c8cfd3; --dim:#6d777e; --ui:#a9b77f; --fr:#79cfe0; --hot:#e5484d; --warn:#e0913a; }
  body.b { --bg:#050806; --panel:#08100a; --panel2:#0b160e; --line:#163020; --line2:#1f4a2c; --ink:#9be3a6; --dim:#4c8a58; --ui:#7fe08c; --fr:#7fe08c; --hot:#ff4f4f; --warn:#ffb347; }
  body.c { --bg:#0b0d10; --panel:#111419; --panel2:#151920; --line:#232a33; --line2:#2f3843; --ink:#dce4ec; --dim:#76818d; --ui:#e4ebf2; --fr:#8cc8ff; --hot:#ff4d4f; --warn:#ffa940; }

  #stage { position: absolute; inset: 0; }
  canvas { position: absolute; inset: 0; }

  /* top strip over the board */
  .top { position: absolute; left: 8px; top: 6px; right: 218px; height: 30px; display: flex; align-items: center; gap: 6px; }
  .sq { width: 30px; height: 30px; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line2); color: var(--ink); }
  .sq svg { width: 14px; height: 14px; }
  .sq.on { border-color: var(--ui); color: var(--ui); }
  .sector { margin-left: 8px; display: flex; flex-direction: column; line-height: 1.15; }
  .sector b { font-family: var(--cond); font-weight: 600; font-size: 12px; letter-spacing: 1.5px; color: var(--ink); }
  .sector span { font-size: 9px; color: var(--dim); letter-spacing: 1px; }
  .spacer { flex: 1; }
  .next { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--dim); letter-spacing: 1px; }
  .next .tag { color: var(--ink); padding: 2px 6px; border: 1px solid var(--line2); background: var(--panel); }
  .next .tag i { font-style: normal; color: var(--hot); }
  .wave { font-family: var(--cond); font-size: 12px; letter-spacing: 1.5px; color: var(--ink); padding: 0 8px; height: 30px; display: flex; align-items: center; border: 1px solid var(--line2); background: var(--panel); }
  .wave em { font-style: normal; color: var(--dim); margin-left: 4px; }

  /* console */
  .console { position: absolute; top: 0; right: 0; bottom: 0; width: 210px; background: var(--panel); border-left: 1px solid var(--line2); display: flex; flex-direction: column; }
  .c-head { padding: 8px 10px 8px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: end; }
  .lbl { font-size: 8.5px; letter-spacing: 1.6px; color: var(--dim); text-transform: uppercase; }
  .integ { grid-column: 1 / -1; height: 5px; margin-top: 3px; background: color-mix(in srgb, var(--hot) 28%, transparent); position: relative; }
  .integ i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--fr); }
  .big { font-family: var(--cond); font-weight: 600; font-size: 20px; color: var(--ink); line-height: 1; }
  .big small { font-size: 11px; color: var(--dim); font-weight: 500; }
  .bits { text-align: right; }
  .bits .big { color: var(--ink); }
  .bits .gain { font-size: 10px; color: var(--fr); }
  .tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; border-bottom: 1px solid var(--line); }
  .tabs div { text-align: center; padding: 6px 0 5px; font-size: 9px; letter-spacing: 1.8px; color: var(--dim); border-bottom: 2px solid transparent; }
  .tabs div.on { color: var(--ink); border-bottom-color: var(--ui); }
  .asset { padding: 7px 10px; display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 0; }
  .a-top { display: flex; gap: 8px; align-items: center; }
  .a-top canvas { position: static; width: 34px; height: 34px; border: 1px solid var(--line2); background: var(--panel2); }
  .a-name { font-family: var(--cond); font-weight: 600; font-size: 14px; letter-spacing: 1px; }
  .a-tier { font-size: 9px; color: var(--dim); letter-spacing: 1.2px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; font-size: 10px; }
  .stats div { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding: 1px 0; }
  .stats span { color: var(--dim); }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
  .seg div { text-align: center; font-size: 8.5px; letter-spacing: 1px; padding: 4px 0; color: var(--dim); border: 1px solid var(--line); }
  .seg div.on { color: var(--ink); border-color: var(--ui); }
  .branches { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .br { border: 1px solid var(--line2); padding: 5px 6px; background: var(--panel2); display: flex; flex-direction: column; gap: 2px; }
  .br.on { border-color: var(--ui); }
  .br b { font-family: var(--cond); font-size: 11px; letter-spacing: 0.6px; }
  .br span { font-size: 8.5px; color: var(--dim); line-height: 1.25; }
  .br em { font-style: normal; font-size: 10px; color: var(--ink); margin-top: 2px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: auto; }
  .btn { text-align: center; font-size: 9px; letter-spacing: 1.4px; padding: 7px 0; border: 1px solid var(--line2); color: var(--ink); }
  .btn.prim { background: var(--ui); color: var(--bg); border-color: var(--ui); font-weight: 600; }
  .c-foot { padding: 6px 10px; border-top: 1px solid var(--line); font-size: 8.5px; color: var(--ink); white-space: nowrap; overflow: hidden; }
  .c-foot .t { color: var(--dim); }
  .c-foot u { text-decoration: none; color: var(--fr); }

  /* event log ticker */
  .log { position: absolute; left: 16px; bottom: 10px; font-size: 9px; line-height: 1.5; letter-spacing: 0.3px; color: var(--dim); pointer-events: none; }
  .log div:nth-child(1) { color: var(--ink); }
  .log b { font-weight: 500; color: var(--hot); }
  .log u { text-decoration: none; color: var(--fr); }

  /* sheet view */
  .sheet-title { position: absolute; left: 16px; top: 10px; font-family: var(--cond); font-size: 12px; letter-spacing: 2px; color: var(--dim); }

  /* texture */
  .scan { position: absolute; inset: 0; pointer-events: none; }
  body.a .scan { background: repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0 1px, transparent 1px 3px); }
  body.b .scan { background: repeating-linear-gradient(0deg, rgba(0,0,0,0.28) 0 1px, transparent 1px 3px), radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55)); }
  body.c .scan { background: none; }
  body.b .console, body.b .sq, body.b .wave, body.b .next .tag { text-shadow: 0 0 6px rgba(127,224,140,0.45); }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const P = new URLSearchParams(location.search);
const THEME = P.get('theme') || 'a';
const VIEW = P.get('view') || 'board';
document.body.className = THEME;
const css = (n) => getComputedStyle(document.body).getPropertyValue(n).trim();
const T = { bg: css('--bg'), panel: css('--panel'), line: css('--line'), line2: css('--line2'), ink: css('--ink'), dim: css('--dim'), ui: css('--ui'), fr: css('--fr'), hot: css('--hot'), warn: css('--warn') };
const PHOS = THEME === 'b';
const LW = THEME === 'c' ? 1.1 : 1.4;
const W = innerWidth, H = innerHeight, DPR = 2;

function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function mix(h1, h2, t) { const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16); const c = (s) => Math.round(((a >> s) & 255) * (1 - t) + ((b >> s) & 255) * t); return `rgb(${c(16)},${c(8)},${c(0)})`; }
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w * DPR; c.height = h * DPR; c.style.width = w + 'px'; c.style.height = h + 'px'; const g = c.getContext('2d'); g.scale(DPR, DPR); return [c, g]; }
function glow(g, col, b) { if (PHOS) { g.shadowColor = col; g.shadowBlur = b; } }
function noGlow(g) { g.shadowBlur = 0; }
function poly(g, pts) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath(); }
function ngon(g, x, y, n, r, rot = 0) { const p = []; for (let i = 0; i < n; i++) { const a = rot + i / n * Math.PI * 2; p.push([x + Math.cos(a) * r, y + Math.sin(a) * r]); } poly(g, p); }

/* ------------------------------------------------------------------ towers */
// Top-down silhouettes that read as what the program does. No turrets, no barrels.
function inspector(g, x, y, s, tier, col = T.fr) {
  g.save(); g.lineWidth = LW; g.strokeStyle = col; glow(g, col, 6);
  if (tier >= 3) { // outer sensor ring with three pods
    g.globalAlpha = 0.55; g.beginPath(); g.arc(x, y, s * 0.44, 0, Math.PI * 2); g.stroke(); g.globalAlpha = 1;
    for (let k = 0; k < 3; k++) { const a = -Math.PI / 2 + k * Math.PI * 2 / 3; g.fillStyle = col; g.beginPath(); g.arc(x + Math.cos(a) * s * 0.44, y + Math.sin(a) * s * 0.44, s * 0.05, 0, 7); g.fill(); }
  }
  ngon(g, x, y, 6, s * 0.3, Math.PI / 6); g.fillStyle = T.panel; g.fill(); g.stroke();
  if (tier >= 2) { // side antenna fins
    for (const sx of [-1, 1]) { g.beginPath(); g.moveTo(x + sx * s * 0.3, y - s * 0.1); g.lineTo(x + sx * s * 0.4, y - s * 0.18); g.moveTo(x + sx * s * 0.3, y + s * 0.1); g.lineTo(x + sx * s * 0.4, y + s * 0.18); g.stroke(); }
  }
  g.beginPath(); g.arc(x, y, s * 0.13, 0, 7); g.fillStyle = rgba(col.startsWith('#') ? col : '#8cc8ff', 0.18); g.fill(); g.stroke();
  g.fillStyle = col; g.beginPath(); g.arc(x, y, s * 0.045, 0, 7); g.fill();
  g.restore();
}
function limiter(g, x, y, s, tier, col = T.fr) {
  g.save(); g.lineWidth = LW; g.strokeStyle = col; glow(g, col, 6);
  if (tier >= 3) for (let k = 0; k < 4; k++) { const a = Math.PI / 4 + k * Math.PI / 2; g.beginPath(); g.moveTo(x + Math.cos(a) * s * 0.42, y + Math.sin(a) * s * 0.42); g.lineTo(x + Math.cos(a) * s * 0.5, y + Math.sin(a) * s * 0.5); g.stroke(); }
  if (tier >= 2) { g.globalAlpha = 0.6; g.beginPath(); g.arc(x, y, s * 0.38, 0, 7); g.stroke(); g.globalAlpha = 1; }
  g.beginPath(); g.arc(x, y, s * 0.3, 0, 7); g.fillStyle = T.panel; g.fill(); g.stroke();
  // iris blades
  g.lineWidth = 1.1;
  for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; g.beginPath(); g.moveTo(x + Math.cos(a) * s * 0.29, y + Math.sin(a) * s * 0.29); g.lineTo(x + Math.cos(a + 1.2) * s * 0.1, y + Math.sin(a + 1.2) * s * 0.1); g.stroke(); }
  g.restore();
}
function sandbox(g, x, y, s, tier, branch, col = T.fr) {
  g.save(); g.lineWidth = LW; g.strokeStyle = col; glow(g, col, 6);
  const h = s * 0.3;
  if (branch === 'remote') { g.beginPath(); g.moveTo(x + h, y - h); g.lineTo(x + s * 0.48, y - s * 0.48); g.stroke(); g.beginPath(); g.arc(x + s * 0.48, y - s * 0.48, s * 0.1, Math.PI * 0.25, Math.PI * 1.25); g.stroke(); }
  g.fillStyle = T.panel; g.fillRect(x - h, y - h, h * 2, h * 2); g.strokeRect(x - h, y - h, h * 2, h * 2);
  if (tier >= 2) { g.globalAlpha = 0.55; g.strokeRect(x - h * 1.28, y - h * 1.28, h * 2.56, h * 2.56); g.globalAlpha = 1; }
  // containment core: a cube seen from above
  g.beginPath(); g.moveTo(x, y - h * 0.55); g.lineTo(x + h * 0.55, y); g.lineTo(x, y + h * 0.55); g.lineTo(x - h * 0.55, y); g.closePath(); g.stroke();
  g.beginPath(); g.moveTo(x - h, y - h); g.lineTo(x - h * 0.55, y); g.moveTo(x + h, y + h); g.lineTo(x + h * 0.55, y); g.globalAlpha = 0.5; g.stroke(); g.globalAlpha = 1;
  if (branch === 'cluster') for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) { g.fillStyle = T.panel; g.fillRect(x + sx * s * 0.4 - s * 0.07, y + sy * s * 0.4 - s * 0.07, s * 0.14, s * 0.14); g.strokeRect(x + sx * s * 0.4 - s * 0.07, y + sy * s * 0.4 - s * 0.07, s * 0.14, s * 0.14); }
  g.restore();
}
function upMark(g, x, y, s) { g.save(); g.fillStyle = T.ui; glow(g, T.ui, 4); poly(g, [[x + s * 0.32, y - s * 0.46], [x + s * 0.42, y - s * 0.32], [x + s * 0.22, y - s * 0.32]]); g.fill(); g.restore(); }

/* ----------------------------------------------------------------- malware */
// Health is layers. Each hit strips a shell: the packet shrinks and runs hotter.
function heat(layers, max) { return mix(T.hot, '#ffe2b0', 1 - (layers - 1) / Math.max(1, max - 1)); }
function worm(g, x, y, s, layers, max = 3, a = 0) {
  g.save(); g.translate(x, y); g.rotate(a);
  const col = heat(layers, max);
  glow(g, T.hot, 8);
  for (let k = layers; k >= 1; k--) {
    const r = s * (0.07 + k * 0.05);
    g.globalAlpha = k === 1 ? 1 : 0.35 + 0.5 / k;
    poly(g, [[r * 1.3, 0], [0, r * 0.8], [-r * 1.1, 0], [0, -r * 0.8]]);
    g.lineWidth = 1.2; g.strokeStyle = col; g.stroke();
  }
  g.globalAlpha = 1; poly(g, [[s * 0.08, 0], [0, s * 0.05], [-s * 0.07, 0], [0, -s * 0.05]]); g.fillStyle = col; g.fill();
  g.restore();
}
function spyware(g, x, y, s, layers, max = 2, a = 0) {
  g.save(); g.translate(x, y); g.rotate(a);
  const col = mix(T.warn, '#ffe9c4', 1 - (layers - 1) / Math.max(1, max - 1));
  glow(g, T.warn, 8);
  // exfil streak
  const grd = g.createLinearGradient(-s * 0.7, 0, 0, 0); grd.addColorStop(0, rgba(T.warn, 0)); grd.addColorStop(1, rgba(T.warn, 0.55));
  g.strokeStyle = grd; g.lineWidth = s * 0.06; g.beginPath(); g.moveTo(-s * 0.7, 0); g.lineTo(-s * 0.12, 0); g.stroke();
  for (let k = layers; k >= 1; k--) {
    const r = s * (0.1 + k * 0.05);
    g.globalAlpha = k === 1 ? 1 : 0.5;
    g.beginPath(); g.moveTo(-r, 0); g.quadraticCurveTo(0, -r * 0.8, r, 0); g.quadraticCurveTo(0, r * 0.8, -r, 0); g.lineWidth = 1.2; g.strokeStyle = col; g.stroke();
  }
  g.globalAlpha = 1; g.beginPath(); g.arc(s * 0.02, 0, s * 0.05, 0, 7); g.fillStyle = col; g.fill();
  g.restore();
}
function trojan(g, x, y, s, revealed, layers = 4) {
  g.save();
  const r = s * 0.22;
  if (!revealed) {
    // Disguised: wears the network's own color. Only a thin seam gives it away.
    g.strokeStyle = T.fr; g.lineWidth = 1.4; glow(g, T.fr, 6);
    g.fillStyle = T.panel; g.fillRect(x - r, y - r, r * 2, r * 2); g.strokeRect(x - r, y - r, r * 2, r * 2);
    g.strokeStyle = rgba(T.fr, 0.4); g.strokeRect(x - r * 0.6, y - r * 0.6, r * 1.2, r * 1.2);
    g.strokeStyle = rgba(T.hot, 0.7); g.lineWidth = 1; g.beginPath(); g.moveTo(x - r, y + r * 0.15); g.lineTo(x + r, y - r * 0.15); g.stroke();
  } else {
    glow(g, T.hot, 10);
    for (let k = layers; k >= 1; k--) { const rr = s * (0.08 + k * 0.045); g.globalAlpha = k === 1 ? 1 : 0.35 + 0.4 / k; g.strokeStyle = heat(k, 4); g.lineWidth = 1.2; g.strokeRect(x - rr, y - rr, rr * 2, rr * 2); }
    g.globalAlpha = 1; g.fillStyle = T.hot; g.fillRect(x - s * 0.06, y - s * 0.06, s * 0.12, s * 0.12);
    // fractures where the payload is breaking out
    g.strokeStyle = heat(1, 4); g.lineWidth = 1;
    for (const [dx, dy] of [[1, -1], [-1, 1], [1, 1]]) { g.beginPath(); g.moveTo(x + dx * s * 0.1, y + dy * s * 0.1); g.lineTo(x + dx * s * 0.2, y + dy * s * 0.14); g.stroke(); }
  }
  g.restore();
}
function shatter(g, x, y, s, col = T.hot) {
  g.save(); glow(g, col, 10);
  g.strokeStyle = rgba('#ffffff', 0.8); g.lineWidth = 1; g.beginPath(); g.arc(x, y, s * 0.22, 0, 7); g.stroke();
  const frags = [[0.3, -0.5, 0.2], [0.55, 0.1, 0.9], [-0.2, 0.5, 2.1], [-0.55, -0.15, 3.2], [0.1, 0.6, 4.4], [-0.35, -0.5, 5.2]];
  g.fillStyle = mix(T.hot, '#ffe2b0', 0.6);
  for (const [fx, fy, rot] of frags) { g.save(); g.translate(x + fx * s * 0.55, y + fy * s * 0.55); g.rotate(rot); poly(g, [[0, -s * 0.05], [s * 0.04, s * 0.03], [-s * 0.035, s * 0.03]]); g.fill(); g.restore(); }
  g.restore();
}

/* ------------------------------------------------------------------- board */
const COLS = 18, ROWS = 10;
const grid = [
  '.......I..........',
  'S......I..........',
  '....vv.I..........',
  '....vv.L.S.....L..',
  '.......I.Idddd..CC',
  '.......I.Idddd..CC',
  '....ww.X.I..e.....',
  '....ww...I........',
  'S........I........',
  '.........I........',
];
// Tower overrides: tier and kind per cell (I inspector, L limiter, S sandbox, X sandbox mk1)
const tiers = { '7,1': 2, '9,5': 3, '9,7': 2, '7,3': 2, '15,3': 1 };

function board(L) {
  const [c, g] = canvas(W, H);
  const { ox, oy, s } = L;
  const X = (cx) => ox + cx * s, Y = (cy) => oy + cy * s;
  const blocked = (cx, cy) => { const ch = grid[cy][cx]; return 'IvwdeLXS'.includes(ch) && !(ch === 'S' && cx === 0); };
  // Field
  g.fillStyle = T.bg; g.fillRect(0, 0, W, H);
  g.fillStyle = PHOS ? '#06100a' : rgba(T.panel, 0.55); g.fillRect(ox, oy, COLS * s, ROWS * s);
  // Placement grid: corner ticks instead of full lines
  if (THEME === 'c') {
    g.fillStyle = rgba(T.ink, 0.16);
    for (let y = 0; y <= ROWS; y++) for (let x = 0; x <= COLS; x++) g.fillRect(X(x) - 0.75, Y(y) - 0.75, 1.5, 1.5);
  } else {
    g.strokeStyle = rgba(T.ink, PHOS ? 0.14 : 0.1); g.lineWidth = 1;
    for (let y = 0; y <= ROWS; y++) for (let x = 0; x <= COLS; x++) { const px = X(x) + 0.5, py = Y(y) + 0.5; g.beginPath(); g.moveTo(px - 2.5, py); g.lineTo(px + 2.5, py); g.moveTo(px, py - 2.5); g.lineTo(px, py + 2.5); g.stroke(); }
  }
  // Coordinates
  g.fillStyle = rgba(T.dim, 0.8); g.font = `500 7px ${'IBM Plex Mono'}`; g.textAlign = 'center';
  for (let x = 0; x < COLS; x++) g.fillText(String.fromCharCode(65 + x), X(x + 0.5), oy - 3);
  g.textAlign = 'right'; for (let y = 0; y < ROWS; y++) g.fillText(String(y + 1).padStart(2, '0'), ox - 3, Y(y + 0.5) + 2.5);
  // Frame: hairline with corner brackets
  g.strokeStyle = T.line2; g.strokeRect(ox + 0.5, oy + 0.5, COLS * s, ROWS * s);
  g.strokeStyle = T.ui; g.lineWidth = 1.5; const k = 10;
  for (const [x, y, dx, dy] of [[ox, oy, 1, 1], [ox + COLS * s, oy, -1, 1], [ox, oy + ROWS * s, 1, -1], [ox + COLS * s, oy + ROWS * s, -1, -1]]) { g.beginPath(); g.moveTo(x, y + dy * k); g.lineTo(x, y); g.lineTo(x + dx * k, y); g.stroke(); }

  // Existing network: faint backbone between infrastructure and the Core
  g.strokeStyle = rgba(T.ink, 0.08); g.lineWidth = 1;
  for (const [a, b] of [[[5, 3], [11, 4.5]], [[5, 7], [11, 5.5]], [[12.5, 6.5], [12.5, 5.5]], [[13.5, 4.5], [16, 4.5]]]) { g.beginPath(); g.moveTo(X(a[0]), Y(a[1])); g.lineTo(X(b[0]), Y(b[1])); g.stroke(); }

  // Restricted subnets (hatched) and the DMZ server cluster
  const zone = (x0, y0, w, h, label, sub) => {
    g.save(); g.beginPath(); g.rect(X(x0) + 3, Y(y0) + 3, w * s - 6, h * s - 6); g.clip();
    g.strokeStyle = THEME === 'a' ? rgba('#c9a227', 0.12) : rgba(T.ink, 0.07); g.lineWidth = THEME === 'a' ? 2 : 1;

function bfsRoute(sx, sy, blocked) {
  const dist = Array.from({ length: ROWS }, () => new Array(COLS).fill(-1)), q = [];
  for (const [x, y] of [[16, 4], [17, 4], [16, 5], [17, 5]]) { dist[y][x] = 0; q.push([x, y]); }
  const D = [[1, 0], [0, 1], [0, -1], [-1, 0]];
  while (q.length) { const [x, y] = q.shift(); for (const [dx, dy] of D) { const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS || dist[ny][nx] >= 0 || blocked(nx, ny)) continue; dist[ny][nx] = dist[y][x] + 1; q.push([nx, ny]); } }

  while (dist[y][x] > 0) { const order = [pd, 0, 1, 2, 3]; for (const k of order) { const nx = x + D[k][0], ny = y + D[k][1]; if (nx >= 0 && ny >= 0 && nx < COLS && ny < ROWS && dist[ny][nx] === dist[y][x] - 1) { x = nx; y = ny; pd = k; break; } } out.push([x, y]); if (out.length > 200) break; }
  return out;
}
function chamfer(pts, s, x0) {

  const cs = [pts[0]];

  const out = [cs[0]], ch = s * 0.35;
  for (let i = 1; i < cs.length - 1; i++) { const a = cs[i - 1], p = cs[i], c = cs[i + 1]; const la = Math.hypot(p[0] - a[0], p[1] - a[1]), lc = Math.hypot(c[0] - p[0], c[1] - p[1]); const ca = Math.min(ch, la / 2), cc = Math.min(ch, lc / 2); out.push([p[0] - (p[0] - a[0]) / la * ca, p[1] - (p[1] - a[1]) / la * ca]); out.push([p[0] + (c[0] - p[0]) / lc * cc, p[1] + (c[1] - p[1]) / lc * cc]); }

}

}
function corridor(g, pts, s) {

  { const x = 46, y = 340; inspector(g, x, y, s * 0.8, 2); const tx = x + 110, ty = y - 10; worm(g, tx, ty, s, 2); g.save(); glow(g, T.fr, 6); g.strokeStyle = rgba(T.fr, 0.85); g.beginPath(); g.moveTo(x, y); g.lineTo(tx, ty); g.stroke(); const o = 9, kk = 4; g.strokeStyle = T.fr; for (const [qx, qy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) { g.beginPath(); g.moveTo(tx + qx * o, ty + qy * (o - kk)); g.lineTo(tx + qx * o, ty + qy * o); g.lineTo(tx + qx * (o - kk), ty + qy * o); g.stroke(); } g.restore(); label('INSPECT: BEAM LOCK, STRIPS A LAYER', x + 60, y + 30); }

  { const x = 560, y = 335, r = 20; g.save(); glow(g, T.fr, 8); g.strokeStyle = T.fr; g.lineWidth = 1.2; g.strokeRect(x - r, y - r, r * 2, r * 2); g.strokeStyle = rgba(T.fr, 0.45); g.strokeRect(x - r * 0.7 + 4, y - r * 0.7 - 4, r * 1.4, r * 1.4); g.restore(); worm(g, x - 6, y + 4, s * 0.8, 1); shatter(g, x + 6, y - 2, s * 0.7); label('SANDBOX: ISOLATE, THEN DETONATE', x, y + 30); }
